name: Windows (.exe)

# Builds the Windows program, tests it and, when a version is tagged, publishes it.
#   - On every pull request: tests on Windows + .exe + self-test (downloadable as an "artifact").
#   - When a vX.Y.Z tag is pushed (git tag v1.0.0 && git push origin v1.0.0): it also
#     publishes it on GitHub Releases, where people download it (and the "new version" notice).
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download FFmpeg (LGPL)
        run: python tools/download_ffmpeg.py

      - name: Tests on Windows
        run: |
          $env:PATH = "$PWD\vendor\ffmpeg;$env:PATH"
          python -m pytest -q

      - name: UI check with real clicks (Export)
        run: |
          pip install pyautogui
          $env:PATH = "$PWD\vendor\ffmpeg;$env:PATH"
          python tools/windows_export_check.py "$PWD\export-check.json"

      - name: Save UI check screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-windows
          path: export-check*.png
          if-no-files-found: ignore

      - name: Check that the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = python -c "import audyax; print(audyax.VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION=$v does not match the tag ${{ github.ref_name }}" }

      - name: Build the program
        run: python build.py --zip

      - name: Self-test of the .exe
        run: |
          Start-Process -FilePath "dist\AUDYAX\AUDYAX.exe" -ArgumentList "--self-test", "$PWD\self-test.json" -Wait
          python tools/check_startup.py self-test.json --bundled-ffmpeg

      - name: Save the .zip
        continue-on-error: true   # a full artifact quota must not stop the release
        uses: actions/upload-artifact@v4
        with:
          name: AUDYAX-windows
          path: dist/*.zip

      - name: Publish on Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-Item dist\*.zip).FullName --title "AUDYAX ${{ github.ref_name }}" --generate-notes
