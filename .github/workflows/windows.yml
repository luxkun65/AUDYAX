name: Windows (.exe)

# Genera el programa para Windows, lo prueba y, al marcar una versión, lo publica.
#   - En cada pull request: pruebas en Windows + .exe + autoprueba (descargable como "artifact").
#   - Al subir una etiqueta vX.Y.Z (git tag v1.0.0 && git push origin v1.0.0): además lo
#     publica en GitHub Releases, de donde lo baja la gente (y el aviso de "versión nueva").
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # para crear la versión en Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Descargar FFmpeg (LGPL)
        run: python tools/descargar_ffmpeg.py

      - name: Pruebas en Windows
        run: |
          $env:PATH = "$PWD\vendor\ffmpeg;$env:PATH"
          python -m pytest -q

      - name: Prueba de interfaz con clics reales (menú Exportar)
        run: |
          pip install pyautogui
          $env:PATH = "$PWD\vendor\ffmpeg;$env:PATH"
          python tools/prueba_menu_windows.py "$PWD\menu-antes.json" --antes
          python tools/prueba_menu_windows.py "$PWD\menu-despues.json"

      - name: Guardar capturas de la prueba de interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz-windows
          path: menu-*.png
          if-no-files-found: ignore

      - name: Comprobar que la versión coincide con la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = python -c "import motor_descarga as m; print(m.VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSION=$v no coincide con la etiqueta ${{ github.ref_name }}" }

      - name: Generar el programa
        run: python build.py --zip

      - name: Autoprueba del .exe
        run: |
          Start-Process -FilePath "dist\AUDYAX\AUDYAX.exe" -ArgumentList "--prueba-arranque", "$PWD\prueba-arranque.json" -Wait
          python tools/verificar_arranque.py prueba-arranque.json --ffmpeg-incluido

      - name: Guardar el .zip
        uses: actions/upload-artifact@v4
        with:
          name: AUDYAX-windows
          path: dist/*.zip

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-Item dist\*.zip).FullName --title "AUDYAX ${{ github.ref_name }}" --generate-notes
